<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>てぇてぇ事例募集 | いつそいてぇてぇ</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Header -->

  <header class="header">

    <div class="header-inner">

      <a href="index.html" class="logo">
        いつそいてぇてぇ
      </a>

      <button
        class="hamburger"
        id="hamburger"
        aria-label="メニューを開く"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

  </header>


  <!-- Navigation -->

  <nav class="nav" id="nav">

    <ul class="nav-list">

      <li><a href="index.html">HOME</a></li>
      <li><a href="about.html">ABOUT</a></li>
      <li><a href="teetee.html">てぇてぇ</a></li>
      <li><a href="ranking.html">RANKING</a></li>
      <li><a href="request.html">てぇてぇ事例募集</a></li>

    </ul>

  </nav>


  <!-- Main -->

  <main>

    <section class="page-hero">

      <div class="section-inner">

        <p class="section-label">
          REQUEST
        </p>

        <h1 class="page-title">
          てぇてぇ事例募集
        </h1>

        <p class="page-description">
          「これもてぇてぇだろ！」という事例を<br>
          ぜひ教えてください。
        </p>

      </div>

    </section>


    <!-- Form -->

    <section class="section">

      <div class="section-inner">

        <form class="request-form">

          <div class="form-group">

            <label for="name">
              お名前
            </label>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="名無しでもOK"
            >

          </div>


          <div class="form-group">

            <label for="content">
              てぇてぇ事例
            </label>

            <textarea
              id="content"
              name="content"
              rows="8"
              placeholder="何があったのか教えてください！"
              required
            ></textarea>

          </div>


          <button
            type="submit"
            class="form-button"
          >
            事例を送る
          </button>

          <p class="form-note">
            ※ 送信された内容は確認後、サイトに掲載されます。
          </p>

        </form>

      </div>

    </section>

  </main>


  <!-- Footer -->

  <footer class="footer">

    <div class="footer-inner">

      <p class="footer-title">
        いつそいてぇてぇ
      </p>

      <p class="footer-copy">
        © 2026 いつそいてぇてぇ
      </p>

    </div>

  </footer>


  <!-- JavaScript -->

  <script src="script.js"></script>

</body>
</html>
